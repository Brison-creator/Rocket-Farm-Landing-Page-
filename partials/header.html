<header id="site-header">
  <nav class="wrap nav" aria-label="Primary">
    <a class="wordmark" href="/" aria-label="Rocket Farm home">
      <img class="brand-logo" src="/img/logo-mark.webp" width="380" height="150" alt="Rocket Farm" decoding="async">
    </a>
    <div class="nav-links" id="nav-links">
      <a href="/spaces/"{{cur:/spaces/}}>Spaces &amp; rates</a>
      <a href="/plan/"{{cur:/plan/}}>What's planned</a>
      <a href="/directions/"{{cur:/directions/}}>Directions</a>
      <a href="/kaplan/"{{cur:/kaplan/}}>Eat in Kaplan</a>
      <a href="/faq/"{{cur:/faq/}}>FAQ</a>
      <a href="#" class="sky-switch" role="button">Switch to day sky</a>
    </div>
    <button class="theme-toggle" type="button" aria-label="Switch between day and night sky" title="Day / night">
      <svg class="ic-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a7 7 0 1 0 10.5 10.5z"/></svg>
      <svg class="ic-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-links" aria-label="Open menu">
      <svg class="bars" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      <svg class="x" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <a class="btn btn-primary" href="{{reserve}}">
      <span class="cta-long">Reserve your space</span><span class="cta-short">Reserve</span>
    </a>
  </nav>
</header>
